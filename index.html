<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BangBro Dashboard</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { margin: 0; padding: 0; }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

const S = `
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --nv:#0D1B2E;--nv2:#152236;--nv3:#1E3350;--nv4:#243655;
    --go:#C9943A;--gL:#F0C060;
    --re:#E53E3E;--rL:#FCA5A5;
    --gr:#22C55E;--gR:#86EFAC;
    --or:#F97316;--bl:#3B82F6;
    --gy:#64748B;--gY:#94A3B8;--gZ:#CBD5E1;
    --wh:#F8FAFC;--bd:rgba(255,255,255,0.08);
  }
  body{background:var(--nv);color:var(--wh);font-family:'Noto Sans KR',sans-serif;}
  .app{min-height:100vh;background:linear-gradient(135deg,#0D1B2E,#0A1628,#0D1B2E);}
  .hdr{background:linear-gradient(90deg,var(--nv2),var(--nv3));border-bottom:2px solid var(--go);
       padding:14px 20px;display:flex;align-items:center;justify-content:space-between;
       position:sticky;top:0;z-index:100;}
  .hdr-t{font-family:'Bebas Neue',cursive;font-size:26px;color:var(--gL);letter-spacing:3px;}
  .hdr-s{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--gY);margin-top:2px;}
  .ldot{width:7px;height:7px;background:var(--gr);border-radius:50%;display:inline-block;
        margin-right:5px;animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
  .tabs{display:flex;gap:3px;padding:14px 20px 0;border-bottom:1px solid var(--bd);}
  .tab{padding:8px 16px;border-radius:8px 8px 0 0;font-size:12px;font-weight:700;cursor:pointer;
       transition:all .2s;border:1px solid transparent;border-bottom:none;
       color:var(--gY);background:transparent;font-family:'Noto Sans KR',sans-serif;}
  .tab.on{background:var(--nv3);color:var(--gL);border-color:var(--bd);}
  .tab:hover:not(.on){color:var(--wh);background:rgba(255,255,255,.05);}
  .content{padding:20px;}
  .card{background:var(--nv2);border:1px solid var(--bd);border-radius:12px;padding:18px;
        transition:transform .2s,box-shadow .2s;}
  .card:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.4);}
  .ct{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--gY);
      letter-spacing:2px;text-transform:uppercase;margin-bottom:10px;}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .g5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
  @media(max-width:900px){.g5{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
  @media(max-width:600px){.g5{grid-template-columns:1fr 1fr}}
  .bdg{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;
       font-size:11px;font-weight:700;font-family:'IBM Plex Mono',monospace;}
  .br{background:rgba(229,62,62,.15);color:var(--re);border:1px solid rgba(229,62,62,.3);}
  .bg{background:rgba(34,197,94,.15);color:var(--gr);border:1px solid rgba(34,197,94,.3);}
  .by{background:rgba(234,179,8,.15);color:#EAB308;border:1px solid rgba(234,179,8,.3);}
  .bgy{background:rgba(100,116,139,.15);color:var(--gY);border:1px solid rgba(100,116,139,.3);}
  .bn{font-family:'Bebas Neue',cursive;font-size:46px;line-height:1;}
  .bn.re{color:var(--re)} .bn.gr{color:var(--gr)} .bn.go{color:var(--gL)} .bn.or{color:var(--or)}
  .bn.bl{color:var(--bl)}
  .gb{height:7px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;margin:6px 0;}
  .gf{height:100%;border-radius:4px;transition:width .6s;}
  .sr{display:flex;align-items:center;justify-content:space-between;
      padding:8px 0;border-bottom:1px solid var(--bd);}
  .sr:last-child{border-bottom:none;}
  .sl{font-size:12px;color:var(--gY);}
  .sv{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;}
  .sw{margin:14px 0;}
  .sw label{font-size:11px;color:var(--gY);display:flex;justify-content:space-between;margin-bottom:5px;}
  input[type=range]{width:100%;accent-color:var(--go);cursor:pointer;}
  .rb{background:linear-gradient(135deg,var(--nv3),rgba(201,148,58,.1));
      border:1px solid rgba(201,148,58,.3);border-radius:10px;padding:16px;margin-top:14px;}
  .rr{display:flex;justify-content:space-between;align-items:center;
      padding:7px 0;border-bottom:1px solid var(--bd);}
  .rr:last-child{border-bottom:none;}
  .rl{font-size:12px;color:var(--gY);}
  .rv{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;color:var(--gL);}
  .tl{position:relative;padding-left:22px;}
  .tl::before{content:'';position:absolute;left:7px;top:0;bottom:0;width:2px;background:var(--bd);}
  .ti{position:relative;margin-bottom:18px;}
  .tdot{position:absolute;left:-18px;top:4px;width:11px;height:11px;border-radius:50%;border:2px solid;}
  .ti.dn .tdot{background:var(--gr);border-color:var(--gr);}
  .ti.nw .tdot{background:var(--or);border-color:var(--or);animation:pulse 1.5s infinite;}
  .ti.ft .tdot{background:transparent;border-color:var(--gy);}
  .tt{font-size:12px;font-weight:700;margin-bottom:3px;}
  .td2{font-size:11px;color:var(--gY);line-height:1.5;}
  .ci{display:flex;align-items:flex-start;gap:9px;padding:9px 0;
      border-bottom:1px solid var(--bd);cursor:pointer;}
  .ci:last-child{border-bottom:none;}
  .cb{width:19px;height:19px;border-radius:4px;border:2px solid var(--bd);
      display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;margin-top:1px;}
  .cb.ck{background:var(--gr);border-color:var(--gr);}
  .ctxt{font-size:12px;line-height:1.5;}
  .ctxt.dn{color:var(--gY);text-decoration:line-through;}
  .wb{background:rgba(229,62,62,.1);border:1px solid rgba(229,62,62,.3);
      border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:12px;line-height:1.6;color:#FCA5A5;}
  .gb2{background:rgba(201,148,58,.1);border:1px solid rgba(201,148,58,.3);
       border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:12px;line-height:1.6;color:var(--gL);}
  .ib{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);
      border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:12px;line-height:1.6;color:#93C5FD;}
  .mg{margin-bottom:16px;}
  .fb{display:flex;justify-content:space-between;align-items:center;}
  .sm{font-size:11px;color:var(--gY);}
  .yield-card{background:var(--nv2);border-radius:12px;padding:18px;border:1px solid var(--bd);transition:transform .2s,box-shadow .2s;}
  .yield-card:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,.4);}
  .yield-gauge-wrap{position:relative;margin:16px 0 10px;height:56px;}
  .yield-track{position:absolute;bottom:0;left:0;right:0;height:14px;border-radius:7px;background:linear-gradient(90deg,#22C55E 0%,#22C55E 47%,#EAB308 47%,#EAB308 52%,#EF4444 52%,#EF4444 100%);opacity:.35;}
  .yield-fill{position:absolute;bottom:0;left:0;height:14px;border-radius:7px;transition:width .8s cubic-bezier(.4,0,.2,1);}
  .yield-line{position:absolute;bottom:-4px;width:2px;height:22px;background:rgba(255,255,255,.9);border-radius:1px;transform:translateX(-50%);}
  .yield-line-label{position:absolute;top:-22px;transform:translateX(-50%);font-family:'IBM Plex Mono',monospace;font-size:9px;color:rgba(255,255,255,.7);white-space:nowrap;}
  .yield-pin{position:absolute;bottom:10px;width:3px;height:28px;border-radius:2px;transform:translateX(-50%);transition:left .8s cubic-bezier(.4,0,.2,1);box-shadow:0 0 8px rgba(255,255,255,.6);}
  .yield-pin-label{position:absolute;top:-32px;transform:translateX(-50%);font-family:'Bebas Neue',cursive;font-size:18px;white-space:nowrap;transition:left .8s cubic-bezier(.4,0,.2,1);}
  .yield-ticks{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--gY);}
  .yield-status{border-radius:8px;padding:10px 14px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:8px;margin-top:10px;border:1px solid;transition:all .4s;}
  .yield-history{margin-top:12px;}
  .yh-row{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--bd);}
  .yh-row:last-child{border-bottom:none;}
  .yh-date{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--gY);min-width:52px;}
  .yh-bar-wrap{flex:1;height:6px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;}
  .yh-bar{height:100%;border-radius:3px;transition:width .5s;}
  .yh-val{font-family:'IBM Plex Mono',monospace;font-size:10px;min-width:36px;text-align:right;}
`;

// ── 데이터 ────────────────────────────────────────────────────
const D = {
  sp500:{v:6600,ma:6621}, ndx:{v:24260,ma:24347},
  tqqq:{v:44.88,ytd:-18.3,h:60.69,l:17.50},
  fngu:{v:19.89,ytd:-22.1}, soxl:{v:18.50,ytd:-30.2},
  fg:15, vix:24.98, gold:4347,
  tnx: {
    current: 4.392,
    threshold: 4.5,
    history: [
      {date:'03/17',val:4.31},
      {date:'03/18',val:4.35},
      {date:'03/19',val:4.42},
      {date:'03/20',val:4.39},
      {date:'03/21',val:4.34},
      {date:'03/24',val:4.392},
    ]
  }
};

const fmtW = n => n>=1e8?`${(n/1e8).toFixed(1)}억`:n>=1e4?`${(n/1e4).toFixed(0)}만`:`${n}`;

function YieldGauge({compact=false}) {
  const {current, threshold, history} = D.tnx;
  const MIN = 3.5, MAX = 5.5;
  const isRisk = current >= threshold;
  const pct = ((current - MIN) / (MAX - MIN) * 100).toFixed(1);
  const threshPct = ((threshold - MIN) / (MAX - MIN) * 100).toFixed(1);
  const pinColor = isRisk ? '#EF4444' : '#22C55E';
  const fillGrad = isRisk
    ? 'linear-gradient(90deg,#22C55E,#EAB308 40%,#EF4444)'
    : 'linear-gradient(90deg,#22C55E,#4ADE80)';
  const maxH = Math.max(...history.map(h=>h.val));
  return (
    <div className="yield-card">
      <div className="ct">미국 10년물 국채 금리 (US10Y)</div>
      <div className="fb" style={{marginBottom:4}}>
        <div>
          <div className={`bn ${isRisk?'re':'gr'}`} style={{fontSize:compact?36:46}}>
            {current.toFixed(3)}%
          </div>
          <div className="sm" style={{marginTop:3}}>
            기준선 {threshold}% 대비&nbsp;
            <span style={{color:isRisk?'var(--re)':'var(--gr)',fontWeight:700}}>
              {isRisk ? `+${(current-threshold).toFixed(3)}%` : `-${(threshold-current).toFixed(3)}%`}
            </span>
          </div>
        </div>
        <div style={{textAlign:'right'}}>
          <span className={`bdg ${isRisk?'br':'bg'}`} style={{fontSize:12,padding:'5px 14px'}}>
            {isRisk ? '⚠️ 위험 구간' : '✅ 안정 구간'}
          </span>
          <div className="sm" style={{marginTop:5}}>기준선 {threshold}%</div>
        </div>
      </div>
      <div className="yield-gauge-wrap">
        <div className="yield-ticks">
          {['3.5','3.8','4.0','4.2','4.4','4.5','4.7','5.0','5.2','5.5'].map((t,i)=>(
            <span key={i}>{t}</span>
          ))}
        </div>
        <div className="yield-track"/>
        <div className="yield-fill" style={{width:`${pct}%`,background:fillGrad}}/>
        <div className="yield-line" style={{left:`${threshPct}%`}}>
          <div className="yield-line-label" style={{left:'50%'}}>4.5%</div>
        </div>
        <div className="yield-pin" style={{left:`${pct}%`, background:pinColor}}/>
        <div className="yield-pin-label" style={{left:`${pct}%`, color:pinColor}}>
          {current.toFixed(3)}%
        </div>
      </div>
      <div className="yield-status" style={{
        background: isRisk ? 'rgba(239,68,68,.1)' : 'rgba(34,197,94,.1)',
        borderColor: isRisk ? 'rgba(239,68,68,.35)' : 'rgba(34,197,94,.35)',
        color: isRisk ? '#FCA5A5' : '#86EFAC'
      }}>
        <span style={{fontSize:16}}>{isRisk ? '🔴' : '🟢'}</span>
        <div>
          {isRisk
            ? `현재 ${current.toFixed(3)}% — 4.5% 초과. 주식시장 밸류에이션 압박, 성장주 하락 압력 증가.`
            : `현재 ${current.toFixed(3)}% — 4.5% 미만. 상대적 안정 구간. 주식시장 부담 낮음.`
          }
        </div>
      </div>
      {!compact && (
        <div className="yield-history">
          <div style={{fontSize:10,color:'var(--gY)',marginBottom:6,fontFamily:'IBM Plex Mono',letterSpacing:1}}>최근 추이</div>
          {history.map((h,i)=>{
            const hPct = (h.val/maxH*100).toFixed(0);
            const hRisk = h.val >= threshold;
            return (
              <div className="yh-row" key={i}>
                <span className="yh-date">{h.date}</span>
                <div className="yh-bar-wrap">
                  <div className="yh-bar" style={{width:`${hPct}%`,background: hRisk ? 'var(--re)' : 'var(--gr)'}}/>
                </div>
                <span className="yh-val" style={{color: hRisk?'var(--re)':'var(--gr)'}}>{h.val}%</span>
              </div>
            );
          })}
        </div>
      )}
      <div style={{marginTop:12,display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
        {[
          {label:'4.5% 이상 (위험)', desc:'성장주·레버리지 부담↑\n채권 매력도 증가', c:'var(--re)', bg:'rgba(239,68,68,.08)'},
          {label:'4.5% 미만 (안정)', desc:'주식 밸류에이션 지지\n레버리지 진입 환경 개선', c:'var(--gr)', bg:'rgba(34,197,94,.08)'},
        ].map((b,i)=>(
          <div key={i} style={{background:b.bg,borderRadius:8,padding:'9px 11px',border:`1px solid ${b.c}33`}}>
            <div style={{fontSize:10,fontWeight:700,color:b.c,marginBottom:3}}>{b.label}</div>
            <div style={{fontSize:10,color:'var(--gY)',lineHeight:1.5,whiteSpace:'pre-line'}}>{b.desc}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function T1() {
  const sigs = [
    {l:"S&P 500 vs 200일선",  v:`${D.sp500.v.toLocaleString()} / ${D.sp500.ma.toLocaleString()}`, s:'RED'},
    {l:"나스닥100 vs 200일선", v:`${D.ndx.v.toLocaleString()} / ${D.ndx.ma.toLocaleString()}`,   s:'RED'},
    {l:"Fear & Greed",        v:`${D.fg} — 극단적 공포`,   s:'YELLOW'},
    {l:"10년물 국채 금리",     v:`${D.tnx.current}%`,       s: D.tnx.current >= D.tnx.threshold ? 'RED' : 'GREEN'},
    {l:"VIX 변동성",          v:`${D.vix}`,                s:'RED'},
    {l:"이란 유예 만료",       v:"3/28(금) 만료",            s:'RED'},
  ];
  const ok = sigs.filter(s=>s.s==='GREEN').length;
  const score = Math.round(ok/sigs.length*100);
  const sc = s => s==='GREEN'?'var(--gr)':s==='YELLOW'?'#EAB308':'var(--re)';
  const bc = s => s==='GREEN'?'bg':s==='YELLOW'?'by':'br';
  return (
    <div>
      <div className="g5 mg">
        <div className="card">
          <div className="ct">진입 신호</div>
          <div className="bn re">{score}%</div>
          <div className="sm" style={{marginTop:6}}>{ok}/{sigs.length} 충족</div>
          <div className="gb"><div className="gf" style={{width:`${score}%`,background:'var(--re)'}}/></div>
          <span className="bdg br">현금 보유 구간</span>
        </div>
        <div className="card">
          <div className="ct">Fear & Greed</div>
          <div className="bn or">{D.fg}</div>
          <div className="sm" style={{marginTop:6}}>극단적 공포</div>
          <div className="gb"><div className="gf" style={{width:`${D.fg}%`,background:'linear-gradient(90deg,var(--gr),var(--or),var(--re))'}}/></div>
          <div className="sm">한 자릿수 = 역대급 기회</div>
        </div>
        <div className="card">
          <div className="ct">나스닥 200일선</div>
          <div className="bn re">{D.ndx.v.toLocaleString()}</div>
          <div className="sm" style={{marginTop:6}}>200MA: {D.ndx.ma.toLocaleString()}</div>
          <div className="gb"><div className="gf" style={{width:`${(D.ndx.v/D.ndx.ma*100).toFixed(0)}%`,background:'var(--re)'}}/></div>
          <span className="bdg br">200일선 하회</span>
        </div>
        <div className="card" style={{border: D.tnx.current >= D.tnx.threshold ? '1px solid rgba(239,68,68,.4)' : '1px solid rgba(34,197,94,.4)'}}>
          <div className="ct">US 10년물 금리</div>
          <div className={`bn ${D.tnx.current>=D.tnx.threshold?'re':'gr'}`}>{D.tnx.current}%</div>
          <div className="sm" style={{marginTop:6}}>기준선 {D.tnx.threshold}%</div>
          <div className="gb" style={{background:'rgba(255,255,255,.07)'}}>
            <div className="gf" style={{width:`${((D.tnx.current-3.5)/(5.5-3.5)*100).toFixed(0)}%`,background: D.tnx.current>=D.tnx.threshold ? 'linear-gradient(90deg,#22C55E,#EF4444)' : '#22C55E'}}/>
          </div>
          <span className={`bdg ${D.tnx.current>=D.tnx.threshold?'br':'bg'}`}>{D.tnx.current>=D.tnx.threshold?'위험':'안정'}</span>
        </div>
        <div className="card">
          <div className="ct">VIX</div>
          <div className="bn or">{D.vix}</div>
          <div className="sm" style={{marginTop:6}}>고변동성 구간</div>
          <div className="gb"><div className="gf" style={{width:`${Math.min(100,D.vix*2)}%`,background:'var(--or)'}}/></div>
          <div className="sm">20 이하 시 안정 신호</div>
        </div>
      </div>
      <div className="mg"><YieldGauge/></div>
      <div className="g2">
        <div className="card">
          <div className="ct">신호 체크판</div>
          {sigs.map((s,i)=>(
            <div className="sr" key={i}>
              <span className="sl">{s.l}</span>
              <div style={{display:'flex',alignItems:'center',gap:7}}>
                <span className="sv" style={{color:sc(s.s),fontSize:10}}>{s.v}</span>
                <span className={`bdg ${bc(s.s)}`} style={{fontSize:9,padding:'1px 7px'}}>{s.s==='GREEN'?'OK':s.s==='YELLOW'?'준비':'NG'}</span>
              </div>
            </div>
          ))}
        </div>
        <div>
          <div className="card mg">
            <div className="ct">레버리지 ETF 현황</div>
            {[
              {n:'TQQQ',p:D.tqqq.v,y:D.tqqq.ytd,h:D.tqqq.h,l:D.tqqq.l,d:'나스닥100 3배'},
              {n:'FNGU',p:D.fngu.v,y:D.fngu.ytd,d:'FANG+ 3배'},
              {n:'SOXL',p:D.soxl.v,y:D.soxl.ytd,d:'반도체 3배'},
            ].map((e,i)=>(
              <div key={i} style={{padding:'8px 0',borderBottom:i<2?'1px solid var(--bd)':'none'}}>
                <div className="fb">
                  <div>
                    <span style={{fontFamily:'IBM Plex Mono',fontWeight:700,color:'var(--gL)'}}>{e.n}</span>
                    <span className="sm" style={{marginLeft:7}}>{e.d}</span>
                  </div>
                  <div style={{textAlign:'right'}}>
                    <div style={{fontFamily:'IBM Plex Mono',fontSize:15,fontWeight:700}}>${e.p}</div>
                    <div style={{fontSize:10,color:'var(--re)'}}>{e.y}% YTD</div>
                  </div>
                </div>

          <div className="sr"><span className="sl">QQQ 비중 (자동)</span>

              <div style={{textAlign:'right'}}>
                <div className="sm">총 수익률</div>

            <div className="rb">
