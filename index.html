// ─── 데이터 fetch (다중 프록시 폴백) ──────────────────────────
const PROXIES = [
  url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
  url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`,
  url => `https://proxy.cors.sh/${url}`,
];

async function fetchWithFallback(targetUrl) {
  for (const makeProxy of PROXIES) {
    try {
      const res = await fetch(makeProxy(targetUrl), { signal: AbortSignal.timeout(8000) });
      if (!res.ok) continue;
      const text = await res.text();
      return JSON.parse(text);
    } catch { continue; }
  }
  throw new Error(`All proxies failed for: ${targetUrl}`);
}

async function fetchQuote(symbol, range = "1y", interval = "1d") {
  try {
    const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?range=${range}&interval=${interval}&includePrePost=false`;
    const json = await fetchWithFallback(targetUrl);
    const result = json?.chart?.result?.[0];
    if (!result) return null;

    const closes = result.indicators?.quote?.[0]?.close ?? [];
    const validCloses = closes.filter(v => v != null);
    const current = validCloses[validCloses.length - 1];
    if (!current) return null;

    // 200일 이동평균 계산
    const ma200arr = validCloses.slice(-200);
    const ma200 = ma200arr.length > 0
      ? ma200arr.reduce((a, b) => a + b, 0) / ma200arr.length
      : null;

    // YTD 수익률 (연초 첫 거래일 기준)
    const timestamps = result.timestamp ?? [];
    const currentYear = new Date().getFullYear();
    let ytdBase = null;
    for (let i = 0; i < timestamps.length; i++) {
      if (new Date(timestamps[i] * 1000).getFullYear() === currentYear) {
        ytdBase = validCloses[i];
        break;
      }
    }
    const ytd = ytdBase ? (((current - ytdBase) / ytdBase) * 100) : null;

    // 52주 고가/저가
    const meta = result.meta ?? {};
    const high52 = meta.fiftyTwoWeekHigh ?? Math.max(...validCloses);
    const low52  = meta.fiftyTwoWeekLow  ?? Math.min(...validCloses);

    // 최근 7일 히스토리
    const recentCloses = validCloses.slice(-7);
    const recentTs     = timestamps.slice(-7);
    const history = recentCloses.map((v, i) => {
      const d = recentTs[i] ? new Date(recentTs[i] * 1000) : new Date();
      return {
        date: `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`,
        val: parseFloat(v.toFixed(3))
      };
    });

    return {
      current: parseFloat(current.toFixed(2)),
      ma200:   ma200 ? parseFloat(ma200.toFixed(2)) : null,
      ytd:     ytd   ? parseFloat(ytd.toFixed(1))   : null,
      high52:  parseFloat(high52.toFixed(2)),
      low52:   parseFloat(low52.toFixed(2)),
      history,
    };
  } catch(e) {
    console.error(`fetchQuote error [${symbol}]:`, e.message);
    return null;
  }
}

// Fear & Greed — CNN + 폴백
async function fetchFearGreed() {
  try {
    const json = await fetchWithFallback(
      "https://production.dataviz.cnn.io/index/fearandgreed/graphdata"
    );
    return Math.round(json?.fear_and_greed?.score ?? 15);
  } catch {
    return null;
  }
}

const fmtW = n => n>=1e8?`${(n/1e8).toFixed(1)}억`:n>=1e4?`${(n/1e4).toFixed(0)}만`:`${n}`;
const fmt2 = n => n != null ? n.toLocaleString(undefined, {minimumFractionDigits:2,maximumFractionDigits:2}) : '—';
const now = () => {
  const d = new Date();
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
};

// ─── YieldGauge ────────────────────────────────────────────────
function YieldGauge({ tnx }) {
  if (!tnx) return null;
  const current = tnx.current, threshold = 4.5;
  const MIN = 3.5, MAX = 5.5;
  const isRisk = current >= threshold;
  const pct = Math.min(100, Math.max(0, ((current - MIN) / (MAX - MIN) * 100))).toFixed(1);
  const threshPct = ((threshold - MIN) / (MAX - MIN) * 100).toFixed(1);
  const pinColor = isRisk ? '#EF4444' : '#22C55E';
  const fillGrad = isRisk ? 'linear-gradient(90deg,#22C55E,#EAB308 40%,#EF4444)' : 'linear-gradient(90deg,#22C55E,#4ADE80)';
  const maxH = tnx.history ? Math.max(...tnx.history.map(h=>h.val)) : current;
  return (
    <div className="yield-card">
      <div className="ct">미국 10년물 국채 금리 (US10Y) — 실시간</div>
      <div className="fb" style={{marginBottom:4}}>
        <div>
          <div className={`bn ${isRisk?'re':'gr'}`} style={{fontSize:46}}>{current.toFixed(3)}%</div>
          <div className="sm" style={{marginTop:3}}>
            기준선 {threshold}% 대비&nbsp;
            <span style={{color:isRisk?'var(--re)':'var(--gr)',fontWeight:700}}>
              {isRisk ? `+${(current-threshold).toFixed(3)}%` : `-${(threshold-current).toFixed(3)}%`}
            </span>
          </div>
        </div>
        <span className={`bdg ${isRisk?'br':'bg'}`} style={{fontSize:12,padding:'5px 14px'}}>
          {isRisk ? '⚠️ 위험 구간' : '✅ 안정 구간'}
        </span>
      </div>
      <div className="yield-gauge-wrap">
        <div className="yield-ticks">
          {['3.5','3.8','4.0','4.2','4.4','4.5','4.7','5.0','5.2','5.5'].map((t,i)=><span key={i}>{t}</span>)}
        </div>
        <div className="yield-track"/>
        <div className="yield-fill" style={{width:`${pct}%`,background:fillGrad}}/>
        <div className="yield-line" style={{left:`${threshPct}%`}}>
          <div className="yield-line-label" style={{left:'50%'}}>4.5%</div>
        </div>
        <div className="yield-pin" style={{left:`${pct}%`,background:pinColor}}/>
        <div className="yield-pin-label" style={{left:`${pct}%`,color:pinColor}}>{current.toFixed(3)}%</div>
      </div>
      <div className="yield-status" style={{
        background:isRisk?'rgba(239,68,68,.1)':'rgba(34,197,94,.1)',
        borderColor:isRisk?'rgba(239,68,68,.35)':'rgba(34,197,94,.35)',
        color:isRisk?'#FCA5A5':'#86EFAC'
      }}>
        <span style={{fontSize:16}}>{isRisk?'🔴':'🟢'}</span>
        <div>{isRisk
          ? `현재 ${current.toFixed(3)}% — 4.5% 초과. 성장주 하락 압력 증가.`
          : `현재 ${current.toFixed(3)}% — 4.5% 미만. 상대적 안정 구간.`
        }</div>
      </div>
      {tnx.history && (
        <div style={{marginTop:12}}>
          <div style={{fontSize:10,color:'var(--gY)',marginBottom:6,fontFamily:'IBM Plex Mono',letterSpacing:1}}>최근 추이</div>
          {tnx.history.map((h,i)=>{
            const hPct = (h.val/maxH*100).toFixed(0);
            const hRisk = h.val >= threshold;
            return (
              <div className="yh-row" key={i}>
                <span className="yh-date">{h.date}</span>
                <div className="yh-bar-wrap"><div className="yh-bar" style={{width:`${hPct}%`,background:hRisk?'var(--re)':'var(--gr)'}}/></div>
                <span className="yh-val" style={{color:hRisk?'var(--re)':'var(--gr)'}}>{h.val}%</span>
              </div>
            );
          })}
        </div>
      )}
      <div style={{marginTop:12,display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
        {[
          {label:'4.5% 이상 (위험)',desc:'성장주·레버리지 부담↑\n채권 매력도 증가',c:'var(--re)',bg:'rgba(239,68,68,.08)'},
          {label:'4.5% 미만 (안정)',desc:'주식 밸류에이션 지지\n레버리지 진입 환경 개선',c:'var(--gr)',bg:'rgba(34,197,94,.08)'},
        ].map((b,i)=>(
          <div key={i} style={{background:b.bg,borderRadius:8,padding:'9px 11px',border:`1px solid ${b.c}33`}}>
            <div style={{fontSize:10,fontWeight:700,color:b.c,marginBottom:3}}>{b.label}</div>
            <div style={{fontSize:10,color:'var(--gY)',lineHeight:1.5,whiteSpace:'pre-line'}}>{b.desc}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── T1: 시장현황 ──────────────────────────────────────────────
function T1({ D, fg }) {
  const tnxOk = D.tnx?.current < 4.5;
  const sigs = [
    {l:"S&P500 vs 200일선", v:`${fmt2(D.sp500?.current)} / ${fmt2(D.sp500?.ma200)}`, s: D.sp500?.current > D.sp500?.ma200 ? 'GREEN' : 'RED'},
    {l:"NDX vs 200일선",    v:`${fmt2(D.ndx?.current)} / ${fmt2(D.ndx?.ma200)}`,     s: D.ndx?.current > D.ndx?.ma200   ? 'GREEN' : 'RED'},
    {l:"Fear & Greed",      v:`${fg ?? '—'} ${fg < 20 ? '— 극단적 공포' : fg < 40 ? '— 공포' : fg < 60 ? '— 중립' : '— 탐욕'}`, s: fg != null && fg < 20 ? 'YELLOW' : 'RED'},
    {l:"10년물 국채 금리",  v:`${D.tnx?.current?.toFixed(3) ?? '—'}%`,               s: tnxOk ? 'GREEN' : 'RED'},
    {l:"VIX 변동성",        v:`${fmt2(D.vix?.current)}`,                              s: D.vix?.current < 20 ? 'GREEN' : 'RED'},
    {l:"Gold 안전자산",     v:`$${fmt2(D.gold?.current)}`,                            s: 'YELLOW'},
  ];
  const ok = sigs.filter(s=>s.s==='GREEN').length;
  const score = Math.round(ok/sigs.length*100);
  const sc = s => s==='GREEN'?'var(--gr)':s==='YELLOW'?'#EAB308':'var(--re)';
  const bc = s => s==='GREEN'?'bg':s==='YELLOW'?'by':'br';
  const ndxBelow = D.ndx?.current < D.ndx?.ma200;

  return (
    <div>
      <div className="g5 mg">
        <div className="card">
          <div className="ct">진입 신호</div>
          <div className={`bn ${score>50?'gr':'re'}`}>{score}%</div>
          <div className="sm" style={{marginTop:6}}>{ok}/{sigs.length} 충족</div>
          <div className="gb"><div className="gf" style={{width:`${score}%`,background:score>50?'var(--gr)':'var(--re)'}}/></div>
          <span className={`bdg ${score>50?'bg':'br'}`}>{score>50?'진입 검토':'현금 보유'}</span>
        </div>
        <div className="card">
          <div className="ct">Fear & Greed</div>
          <div className="bn or">{fg ?? '—'}</div>
          <div className="sm" style={{marginTop:6}}>{fg < 20 ? '극단적 공포' : fg < 40 ? '공포' : fg < 60 ? '중립' : '탐욕'}</div>
          <div className="gb"><div className="gf" style={{width:`${fg ?? 0}%`,background:'linear-gradient(90deg,var(--gr),var(--or),var(--re))'}}/></div>
          <div className="sm">한 자릿수 = 역대급 기회</div>
        </div>
        <div className="card">
          <div className="ct">NDX 200일선</div>

// ─── T2: 시뮬레이터 ────────────────────────────────────────────
function T2({ D }) {
  const [cap,setCap]=useState(1000000000);
  const [tpct,setTpct]=useState(50);
  const [fpct,setFpct]=useState(15);
  const [ndxR,setNdxR]=useState(80);
  const [yrs,setYrs]=useState(3);
  const tR=ndxR*2.7,fR=ndxR*3.2,qR=ndxR*0.95;
  const qpct=100-tpct-fpct;
  const tAmt=cap*tpct/100,fAmt=cap*fpct/100,qAmt=cap*qpct/100;
  const ftT=tAmt*(1+tR/100),ftF=fAmt*(1+fR/100),ftQ=qAmt*(1+qR/100);
  const total=ftT+ftF+ftQ;
  const totR=((total-cap)/cap*100).toFixed(1);
  const bT=tAmt*(1-0.55),bF=fAmt*(1-0.65),bQ=qAmt*(1-0.20);
  const bTotal=bT+bF+bQ;
  const bR=((bTotal-cap)/cap*100).toFixed(1);
  return (
    <div>
      <div className="g2">
        <div className="card">
          <div className="ct">포트폴리오 설정</div>
          {[
            {l:"투자 원금",      v:fmtW(cap),                          min:1e8, max:5e9,step:1e8,val:cap, set:setCap},
            {l:"TQQQ 비중",     v:`${tpct}% (${fmtW(cap*tpct/100)})`, min:0,   max:80, step:5,  val:tpct,set:setTpct},
            {l:"FNGU 비중",     v:`${fpct}% (${fmtW(cap*fpct/100)})`, min:0,   max:40, step:5,  val:fpct,set:setFpct},
            {l:"나스닥 수익률", v:`+${ndxR}%`,                         min:-50, max:300,step:10, val:ndxR,set:setNdxR},
            {l:"투자 기간",     v:`${yrs}년`,                          min:1,   max:10, step:1,  val:yrs, set:setYrs},
          ].map((s,i)=>(
            <div className="sw" key={i}>
              <label><span>{s.l}</span><span style={{color:'var(--gL)',fontFamily:'IBM Plex Mono'}}>{s.v}</span></label>
              <input type="range" min={s.min} max={s.max} step={s.step} value={s.val} onChange={e=>s.set(+e.target.value)}/>
            </div>
          ))}
          <div className="sr"><span className="sl">QQQ 비중 (자동)</span>
            <span style={{fontFamily:'IBM Plex Mono',fontSize:12,color:'var(--gL)'}}>{qpct}% ({fmtW(cap*qpct/100)})</span>
          </div>
          <div className="ib" style={{marginTop:12,fontSize:11}}>TQQQ ≈ 나스닥×2.7배 / FNGU ≈ 나스닥×3.2배 (음의복리 감안)</div>
          {D.tqqq?.current && (
            <div style={{marginTop:8,background:'var(--nv3)',borderRadius:8,padding:'8px 12px',fontSize:11,color:'var(--gY)'}}>
              실시간 — TQQQ: <span style={{color:'var(--gL)',fontFamily:'IBM Plex Mono'}}>${fmt2(D.tqqq.current)}</span>&nbsp;
              FNGU: <span style={{color:'var(--gL)',fontFamily:'IBM Plex Mono'}}>${fmt2(D.fngu?.current)}</span>
            </div>
          )}
        </div>
        <div>
          <div className="card mg">
            <div className="ct">낙관 시나리오</div>
            <div className="fb" style={{marginBottom:10}}>
              <div><div className="sm">최종 자산</div><div className="bn gr">{fmtW(total)}</div></div>
              <div style={{textAlign:'right'}}>
                <div className="sm">총 수익률</div>
                <div style={{fontFamily:'IBM Plex Mono',fontSize:26,fontWeight:700,color:total>cap?'var(--gr)':'var(--re)'}}>{totR>0?'+':''}{totR}%</div>
              </div>
            </div>
            <div className="rb">
              {[['원금',fmtW(cap)],['TQQQ 수익',fmtW(ftT-tAmt)],['FNGU 수익',fmtW(ftF-fAmt)],['QQQ 수익',fmtW(ftQ-qAmt)],['최종 합계',fmtW(total)]].map(([l,v],i)=>(
                <div className="rr" key={i}><span className="rl">{l}</span><span className="rv">{v}</span></div>
              ))}
            </div>
          </div>
          <div className="card">
            <div className="ct">폭락 시나리오 (200일선 무시 진입 시)</div>
            <div className="fb" style={{marginBottom:10}}>
              <div><div className="sm">최종 자산</div><div className="bn re">{fmtW(bTotal)}</div></div>
              <div style={{textAlign:'right'}}>
                <div className="sm">손실률</div>

            {ev:'2022.10 금리', buy:'$15', ret:'+287%',  c:'var(--gr)'},

              <div style={{fontFamily:'Bebas Neue',fontSize:26,color:h.c}}>{h.ret}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

            <div key={it.k} className="ci" onClick={()=>tog(it.k)}>
              <div className={`cb ${done[it.k]?'ck':''}`}>{done[it.k]&&<span style={{color:'#fff',fontSize:11,fontWeight:900}}>✓</span>}</div>
              <div className={`ctxt ${done[it.k]?'dn':''}`}>{it.tx}</div>
            </div>
          ))}
        </div>
      ))}
      <div className="wb">본 내용은 학습 참고 자료이며 투자 권유가 아닙니다. 모든 투자 결정은 본인의 판단과 책임 하에 이루어져야 합니다.</div>
    </div>
  );
}

// ─── App ───────────────────────────────────────────────────────
function App() {
  const [tab, setTab] = useState(0);
  const [D, setD] = useState({});
  const [fg, setFg] = useState(null);
  const [loading, setLoading] = useState(true);
  const [lastUpdate, setLastUpdate] = useState('');
  const [hasError, setHasError] = useState(false);

  const loadData = useCallback(async () => {
    setLoading(true);
    setHasError(false);
    try {
      // Promise.allSettled: 하나 실패해도 나머지 계속 진행
      const results = await Promise.allSettled([
        fetchQuote('^GSPC'),
        fetchQuote('^NDX'),
        fetchQuote('TQQQ'),
        fetchQuote('FNGU'),
        fetchQuote('SOXL'),
        fetchQuote('^VIX', '3mo'),
        fetchQuote('GLD'),
        fetchQuote('^TNX'),
        fetchFearGreed(),
      ]);
      const [sp500, ndx, tqqq, fngu, soxl, vix, gold, tnx, fearGreed] =
        results.map(r => r.status === 'fulfilled' ? r.value : null);

      setD({ sp500, ndx, tqqq, fngu, soxl, vix, gold, tnx });
      setFg(fearGreed);
      setLastUpdate(now());

      // 핵심 3개도 다 실패하면 에러 표시
      if (!sp500 && !ndx && !tqqq) setHasError(true);
    } catch(e) {
      console.error(e);
      setHasError(true);
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => {
    loadData();
    // 30분마다 자동 갱신
    const timer = setInterval(loadData, 30 * 60 * 1000);
    return () => clearInterval(timer);
  }, [loadData]);

  const tabs = ['📊 시장 현황','💰 수익 시뮬레이터','🎯 바닥 신호판','✅ 실행 체크리스트'];

  return (
    <>
      <style>{S}</style>
      <div className="app">
        <div className="hdr">
          <div>
            <div className="hdr-t">BangBro Dashboard</div>
            <div className="hdr-s">뱅브로식 미국주식 투자 모니터링 시스템</div>
          </div>
          <div style={{textAlign:'right',display:'flex',flexDirection:'column',alignItems:'flex-end',gap:6}}>
            {loading
              ? <span className="err-badge">⟳ 데이터 로딩 중...</span>
              : hasError
              ? <span className="err-badge" onClick={loadData} style={{cursor:'pointer'}}>⚠️ 재시도 클릭</span>
              : <span className="live-badge"><span className="ldot" style={{margin:0}}/> LIVE</span>
            }
            <div style={{fontFamily:'IBM Plex Mono',fontSize:11,color:'var(--gY)'}}>
              {lastUpdate || '—'}
            </div>
            <button onClick={loadData} style={{background:'var(--nv3)',border:'1px solid var(--bd)',borderRadius:6,color:'var(--gY)',fontSize:10,padding:'3px 10px',cursor:'pointer',fontFamily:'IBM Plex Mono'}}>
              🔄 새로고침
            </button>
          </div>
        </div>
        <div className="tabs">
          {tabs.map((t,i)=>(
            <button key={i} className={`tab ${tab===i?'on':''}`} onClick={()=>setTab(i)}>{t}</button>
          ))}
        </div>
        <div className="content">
          {loading && Object.keys(D).length === 0 ? (
            <div className="loading">
              <div className="spin"/>
              <div className="loading-txt">Yahoo Finance에서 실시간 데이터를 불러오는 중...</div>
              <div style={{fontSize:11,color:'var(--gy)'}}>S&P500, NDX, TQQQ, FNGU, SOXL, VIX, Gold, TNX + 200일선 계산 중</div>
            </div>
          ) : (
            <>
              {tab===0 && <T1 D={D} fg={fg}/>}
              {tab===1 && <T2 D={D}/>}
              {tab===2 && <T3 D={D} fg={fg}/>}
              {tab===3 && <T4/>}
            </>
          )}
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
