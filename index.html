  const res = await fetch('/api/quote');
  if (!res.ok) throw new Error(`API error: ${res.status}`);
  return res.json();
}

const fmtW = n => n>=1e8?`${(n/1e8).toFixed(1)}??:n>=1e4?`${(n/1e4).toFixed(0)}留?:`${n}`;
const fmt2 = n => n!=null ? n.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}) : '??;
const nowStr = () => {
  const d = new Date();
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
};

function YieldGauge({ tnx }) {
  if (!tnx) return null;
  const cur = tnx.current, thr = 4.5, MIN = 3.5, MAX = 5.5;
  const isRisk = cur >= thr;
  const pct = Math.min(100, Math.max(0, (cur-MIN)/(MAX-MIN)*100)).toFixed(1);
  const thrPct = ((thr-MIN)/(MAX-MIN)*100).toFixed(1);
  const pinColor = isRisk ? '#EF4444' : '#22C55E';
  const fillGrad = isRisk ? 'linear-gradient(90deg,#22C55E,#EAB308 40%,#EF4444)' : 'linear-gradient(90deg,#22C55E,#4ADE80)';
  const maxH = tnx.history ? Math.max(...tnx.history.map(h=>h.val)) : cur;
  return (
    <div className="yield-card">
      <div className="ct">誘멸뎅 10?꾨Ъ 援?콈 湲덈━ (US10Y) ???ㅼ떆媛?/div>
      <div className="fb" style={{marginBottom:4}}>
        <div>
          <div className={`bn ${isRisk?'re':'gr'}`}>{cur.toFixed(3)}%</div>
          <div className="sm" style={{marginTop:3}}>
            湲곗???{thr}% ?鍮?nbsp;
            <span style={{color:isRisk?'var(--re)':'var(--gr)',fontWeight:700}}>
              {isRisk?`+${(cur-thr).toFixed(3)}%`:`-${(thr-cur).toFixed(3)}%`}
            </span>
          </div>
        </div>
        <span className={`bdg ${isRisk?'br':'bg'}`} style={{fontSize:12,padding:'5px 14px'}}>
          {isRisk?'?좑툘 ?꾪뿕 援ш컙':'???덉젙 援ш컙'}
        </span>
      </div>
      <div className="yield-gauge-wrap">
        <div className="yield-ticks">{['3.5','3.8','4.0','4.2','4.4','4.5','4.7','5.0','5.2','5.5'].map((t,i)=><span key={i}>{t}</span>)}</div>
        <div className="yield-track"/>
        <div className="yield-fill" style={{width:`${pct}%`,background:fillGrad}}/>
        <div className="yield-line" style={{left:`${thrPct}%`}}><div className="yield-line-label" style={{left:'50%'}}>4.5%</div></div>
        <div className="yield-pin" style={{left:`${pct}%`,background:pinColor}}/>
        <div className="yield-pin-label" style={{left:`${pct}%`,color:pinColor}}>{cur.toFixed(3)}%</div>
      </div>
      <div className="yield-status" style={{background:isRisk?'rgba(239,68,68,.1)':'rgba(34,197,94,.1)',borderColor:isRisk?'rgba(239,68,68,.35)':'rgba(34,197,94,.35)',color:isRisk?'#FCA5A5':'#86EFAC'}}>
        <span style={{fontSize:16}}>{isRisk?'?뵶':'?윟'}</span>
        <div>{isRisk?`?꾩옱 ${cur.toFixed(3)}% ??4.5% 珥덇낵. ?깆옣二??섎씫 ?뺣젰 利앷?.`:`?꾩옱 ${cur.toFixed(3)}% ??4.5% 誘몃쭔. ?곷????덉젙 援ш컙.`}</div>
      </div>
      {tnx.history&&<div style={{marginTop:12}}>
        <div style={{fontSize:10,color:'var(--gY)',marginBottom:6,fontFamily:'IBM Plex Mono',letterSpacing:1}}>理쒓렐 異붿씠</div>
        {tnx.history.map((h,i)=>{
          const hPct=(h.val/maxH*100).toFixed(0), hRisk=h.val>=thr;
          return <div className="yh-row" key={i}>
            <span className="yh-date">{h.date}</span>
            <div className="yh-bar-wrap"><div className="yh-bar" style={{width:`${hPct}%`,background:hRisk?'var(--re)':'var(--gr)'}}/></div>
            <span className="yh-val" style={{color:hRisk?'var(--re)':'var(--gr)'}}>{h.val}%</span>
          </div>;
        })}
      </div>}
      <div style={{marginTop:12,display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
        {[{label:'4.5% ?댁긽 (?꾪뿕)',desc:'?깆옣二셋룸젅踰꾨━吏 遺?닳넁\n梨꾧텒 留ㅻ젰??利앷?',c:'var(--re)',bg:'rgba(239,68,68,.08)'},
          {label:'4.5% 誘몃쭔 (?덉젙)',desc:'二쇱떇 諛몃쪟?먯씠??吏吏\n?덈쾭由ъ? 吏꾩엯 ?섍꼍 媛쒖꽑',c:'var(--gr)',bg:'rgba(34,197,94,.08)'}].map((b,i)=>(
          <div key={i} style={{background:b.bg,borderRadius:8,padding:'9px 11px',border:`1px solid ${b.c}33`}}>
            <div style={{fontSize:10,fontWeight:700,color:b.c,marginBottom:3}}>{b.label}</div>
            <div style={{fontSize:10,color:'var(--gY)',lineHeight:1.5,whiteSpace:'pre-line'}}>{b.desc}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function T1({D,fg}) {
  const tnxOk = D.tnx?.current < 4.5;
  const ndxOk = D.ndx?.current > D.ndx?.ma200;
  const sigs = [
    {l:"S&P500 vs 200?쇱꽑", v:`${fmt2(D.sp500?.current)} / ${fmt2(D.sp500?.ma200)}`, s:D.sp500?.current>D.sp500?.ma200?'GREEN':'RED'},
    {l:"NDX vs 200?쇱꽑",    v:`${fmt2(D.ndx?.current)} / ${fmt2(D.ndx?.ma200)}`,     s:ndxOk?'GREEN':'RED'},
    {l:"Fear & Greed",      v:`${fg??'??} ${fg<20?'??洹밸떒??怨듯룷':fg<40?'??怨듯룷':fg<60?'??以묐┰':'???먯슃'}`, s:fg!=null&&fg<20?'YELLOW':'RED'},
    {l:"10?꾨Ъ 援?콈 湲덈━",  v:`${D.tnx?.current?.toFixed(3)??'??}%`,                 s:tnxOk?'GREEN':'RED'},
    {l:"VIX 蹂?숈꽦",        v:`${fmt2(D.vix?.current)}`,                              s:D.vix?.current<20?'GREEN':'RED'},

  ];
  const ok=sigs.filter(s=>s.s==='GREEN').length;
  const score=Math.round(ok/sigs.length*100);

  return (

          {ct:'Fear & Greed', val:fg??'??, sub:fg<20?'洹밸떒??怨듯룷':fg<40?'怨듯룷':fg<60?'以묐┰':'?먯슃', color:'or', bar:fg??0, barColor:'linear-gradient(90deg,var(--gr),var(--or),var(--re))', badge:fg<20?'by':'br', badgeTxt:'吏??},
          {ct:'NDX 200?쇱꽑', val:(D.ndx?.current?.toLocaleString()??'??), sub:`200MA: ${D.ndx?.ma200?.toLocaleString()??'??}`, color:ndxOk?'gr':'re', bar:D.ndx?.current&&D.ndx?.ma200?Math.min(100,(D.ndx.current/D.ndx.ma200*100).toFixed(0)):0, barColor:ndxOk?'var(--gr)':'var(--re)', badge:ndxOk?'bg':'br', badgeTxt:ndxOk?'200?쇱꽑 ?곹쉶':'200?쇱꽑 ?섑쉶'},
          {ct:'US 10Y Yield', val:`${D.tnx?.current?.toFixed(3)??'??}%`, sub:'湲곗???4.5%', color:tnxOk?'gr':'re', bar:D.tnx?.current?((D.tnx.current-3.5)/(5.5-3.5)*100).toFixed(0):0, barColor:tnxOk?'#22C55E':'linear-gradient(90deg,#22C55E,#EF4444)', badge:tnxOk?'bg':'br', badgeTxt:tnxOk?'?덉젙':'?꾪뿕'},
          {ct:'VIX', val:fmt2(D.vix?.current), sub:D.vix?.current<20?'?덉젙':'怨좊??숈꽦', color:D.vix?.current<20?'gr':'or', bar:Math.min(100,(D.vix?.current??0)*2), barColor:'var(--or)', badge:D.vix?.current<20?'bg':'by', badgeTxt:'蹂?숈꽦'},
        ].map((k,i)=>(
          <div className="card" key={i}>
            <div className="ct">{k.ct}</div>
            <div className={`bn ${k.color}`}>{k.val}</div>
            <div className="sm" style={{marginTop:6}}>{k.sub}</div>
            <div className="gb"><div className="gf" style={{width:`${k.bar}%`,background:k.barColor}}/></div>
            <span className={`bdg ${k.badge}`}>{k.badgeTxt}</span>
          </div>
        ))}
      </div>
      <div className="mg"><YieldGauge tnx={D.tnx}/></div>
      <div className="g2">
        <div className="card">
          <div className="ct">?좏샇 泥댄겕??/div>
          {sigs.map((s,i)=>(
            <div className="sr" key={i}>
              <span className="sl">{s.l}</span>
              <div style={{display:'flex',alignItems:'center',gap:7}}>
                <span className="sv" style={{color:sc(s.s),fontSize:10}}>{s.v}</span>
                <span className={`bdg ${bc(s.s)}`} style={{fontSize:9,padding:'1px 7px'}}>{s.s==='GREEN'?'OK':s.s==='YELLOW'?'以鍮?:'NG'}</span>

          ))}
        </div>
        <div>
          <div className="card mg">
            <div className="ct">?덈쾭由ъ? ETF ?꾪솴</div>
            {[{n:'TQQQ',d:'?섏뒪??00 3諛?,data:D.tqqq},{n:'FNGU',d:'FANG+ 3諛?,data:D.fngu},{n:'SOXL',d:'諛섎룄泥?3諛?,data:D.soxl}].map((e,i)=>(
              <div key={i} style={{padding:'8px 0',borderBottom:i<2?'1px solid var(--bd)':'none'}}>
                <div className="fb">
                  <div><span style={{fontFamily:'IBM Plex Mono',fontWeight:700,color:'var(--gL)'}}>{e.n}</span><span className="sm" style={{marginLeft:7}}>{e.d}</span></div>
                  <div style={{textAlign:'right'}}>

              <div style={{fontSize:11,color:'var(--gy)'}}>S&P500 쨌 NDX 쨌 TQQQ 쨌 FNGU 쨌 SOXL 쨌 VIX 쨌 Gold 쨌 TNX</div>
            </div>
          ):(
            <>
              {tab===0&&<T1 D={D} fg={fg}/>}
              {tab===1&&<T2 D={D}/>}
              {tab===2&&<T3 D={D} fg={fg}/>}
              {tab===3&&<T4/>}
            </>
          )}
        </div>
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
